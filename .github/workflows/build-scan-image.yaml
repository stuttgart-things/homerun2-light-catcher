---
name: Build, Push & Scan Container Image
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-pr:
    if: github.event_name == 'pull_request'
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-ko-build.yaml@main
    with:
      runs-on: ubuntu-latest
      registry: ghcr.io
      # The head of the pull request, not the merge commit GitHub checks out
      # by default. The image is tagged `pr-<n>-<head sha>`, the string the
      # preview ApplicationSet composes from its own `.head_sha`, so building
      # anything else puts a name on an artefact that is not what it says.
      ref: ${{ github.event.pull_request.head.sha }}
      tags: pr-${{ github.event.number }}-${{ github.event.pull_request.head.sha }},pr-${{ github.event.number }}
    secrets: inherit # pragma: allowlist secret

  # The WLED mock ships from this repository too (cmd/wled-mock, released as
  # its own image by release.yaml), and the light-catcher preview deploys it
  # alongside the catcher. Built per PR for the same reason the catcher is:
  # a change to the mock is a change to this repository, and a preview that
  # runs the last release of it shows everything except what the PR changed.
  # The chart uses one version string for image and kustomize base, so both
  # halves are published under the same `pr-<n>-<head sha>` tag.
  build-pr-wled-mock:
    if: github.event_name == 'pull_request'
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-ko-build.yaml@main
    with:
      runs-on: ubuntu-latest
      registry: ghcr.io
      image-repo: stuttgart-things/homerun2-wled-mock
      build-path: ./cmd/wled-mock
      ref: ${{ github.event.pull_request.head.sha }}
      tags: pr-${{ github.event.number }}-${{ github.event.pull_request.head.sha }},pr-${{ github.event.number }}
    secrets: inherit # pragma: allowlist secret

  build-main:
    if: github.event_name != 'pull_request'
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-ko-build.yaml@main
    with:
      runs-on: ubuntu-latest
    secrets: inherit # pragma: allowlist secret
